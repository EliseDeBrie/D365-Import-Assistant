<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h2>D365 Import Assistant</h2>

    <label class="toggle">
      <input type="checkbox" id="showLauncher" />
      Show the Import Assist button

    </p>
    <script src="popup.js"></script>
  </body>
</html>
